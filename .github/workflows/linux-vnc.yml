# Reverse Linux VNC for GitHub Actions
# This YAML establishes the "build" workflow where we will execute all required scripts
# During the process, it will set up Tailscale for easy SSH/VNC connectivity and ngrok for tunnel access

name: Ubuntu
on: [push]
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Preparing environment...
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        # TAILSCALE_AUTH_KEY secret should be from Tailscale Admin → Keys (starts with tskey-auth-)
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: ./scripts/configure.sh
    - name: Starting VNC Server...
      env:
        VNC_SCREENSIZE: ${{ secrets.VNC_SCREENSIZE }}
        VNC_DEPTHVALUE: ${{ secrets.VNC_DEPTHVALUE }}
      run: export PATH=$PATH:/opt/TurboVNC/bin && cd $HOME && vncserver :1 -geometry $VNC_SCREENSIZE -depth $VNC_DEPTHVALUE -rfbport 7582
    - name: Starting Tailscale (using GitHub Action)...
      uses: tailscale/github-action@v4
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        tags: tag:vnc
        hostname: vnc-actions
    - name: Get Tailscale IP...
      run: tailscale ip -4 > /tmp/tailscale_ip.txt 2>/dev/null || echo "100.100.100.100" > /tmp/tailscale_ip.txt
    - name: Creating tunnel with ngrok...
      run: ngrok tcp 7582
    - name: Display Connection Info...
      run: |
        echo "=== VNC Connection Options ==="
        echo ""
        echo "1) Tailscale VNC (recommended - no tunnel needed):"
        echo "   Tailscale IP: $(cat /tmp/tailscale_ip.txt)"
        echo "   Connect with your VNC client to: 5901 (or use tailscale vnc address)"
        echo ""
        echo "2) SSH via Tailscale:"
        echo "   SSH to: $(cat /tmp/tailscale_ip.txt) port 22"
        echo "   Username: runner"
        echo ""
        echo "3) Ngrok tunnel (traditional method):"
        echo "   Check ngrok dashboard for active tunnel"
        echo ""
        echo "=== Full Connection Details ==="
        echo "VNC Server running on port 5901 locally"
        echo "Tailscale IP: $(cat /tmp/tailscale_ip.txt)"
        echo "Ngrok tunnel: running on port 7582"